<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Apna Jind app icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a4a8a"/>
      <stop offset="0.5" stop-color="#003366"/>
      <stop offset="1" stop-color="#001a33"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa24f"/>
      <stop offset="1" stop-color="#f58425"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f58425" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f58425" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#ffffff" opacity="0.14"/>
    </pattern>
    <clipPath id="inner"><circle cx="256" cy="170" r="66"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#dots)"/>
  <circle cx="256" cy="190" r="230" fill="url(#glow)"/>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <path d="M96 84 Q96 112 124 112 Q96 112 96 140 Q96 112 68 112 Q96 112 96 84Z"/>
    <path d="M430 110 Q430 128 448 128 Q430 128 430 146 Q430 128 412 128 Q430 128 430 110Z"/>
    <path d="M420 300 Q420 312 432 312 Q420 312 420 324 Q420 312 408 312 Q420 312 420 300Z" opacity="0.8"/>
  </g>
  <g fill="#f58425">
    <path d="M86 270 Q86 284 100 284 Q86 284 86 298 Q86 284 72 284 Q86 284 86 270Z"/>
    <circle cx="380" cy="64" r="6"/>
    <circle cx="64" cy="190" r="5"/>
  </g>

  <!-- Pin hard shadow -->
  <path d="M268 348 C268 348 172 260 172 184 A96 96 0 0 1 364 184 C364 260 268 348 268 348 Z" fill="#00152b"/>

  <!-- Location pin -->
  <path d="M256 334 C256 334 160 246 160 170 A96 96 0 0 1 352 170 C352 246 256 334 256 334 Z" fill="url(#pin)"/>
  <circle cx="256" cy="170" r="70" fill="#ffffff"/>

  <!-- City skyline inside the pin -->
  <g clip-path="url(#inner)" fill="#003366">
    <rect x="194" y="150" width="24" height="90"/>
    <rect x="222" y="120" width="28" height="120"/>
    <rect x="254" y="138" width="22" height="102"/>
    <rect x="280" y="156" width="28" height="84"/>
    <rect x="190" y="206" width="132" height="40" fill="#001f40"/>
  </g>
  <g fill="#f58425">
    <rect x="229" y="132" width="5" height="7"/><rect x="239" y="132" width="5" height="7"/>
    <rect x="229" y="148" width="5" height="7"/><rect x="239" y="148" width="5" height="7"/>
    <rect x="229" y="164" width="5" height="7"/><rect x="239" y="164" width="5" height="7"/>
    <rect x="260" y="150" width="5" height="7"/><rect x="260" y="166" width="5" height="7"/>
    <rect x="287" y="168" width="5" height="7"/><rect x="297" y="168" width="5" height="7"/>
    <rect x="200" y="162" width="5" height="7"/><rect x="209" y="162" width="5" height="7"/>
  </g>
  <!-- Flag on tallest tower -->
  <g clip-path="url(#inner)">
    <line x1="236" y1="120" x2="236" y2="102" stroke="#003366" stroke-width="3"/>
    <path d="M236 102 L250 107 L236 112 Z" fill="#f58425"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="388" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="16" fill="#f58425">APNA</text>
  <text x="256" y="458" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI', Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="4" fill="#ffffff">JIND</text>
</svg>