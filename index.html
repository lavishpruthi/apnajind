<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ApnaJind - Jind ka apna directory</title>
  <meta name="theme-color" content="#202F55">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://nominatim.openstreetmap.org; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="top">
    <div class="wrap">
      <div class="brand">Apna<b>Jind</b></div>
      <div class="sub">Jind ka apna directory</div>
      <div class="top-actions"><button class="language-toggle" id="languageToggle" type="button" aria-label="Change language">हिन्दी</button><button class="install-app" id="installApp" type="button" hidden>＋ Install app</button><a class="instagram-link" href="https://www.instagram.com/ApnaJind/" target="_blank" rel="noopener noreferrer" aria-label="Follow ApnaJind on Instagram" title="ApnaJind on Instagram"><img src="icons/instagram.svg" alt=""></a><button class="session-logout" id="sessionLogout" type="button" hidden></button></div>
      <form class="search" id="searchForm" role="search"><input id="q" type="search" list="searchSuggestions" autocomplete="off"
          placeholder="Search shop, food, doctor, area" aria-label="Search businesses"><button
          class="btn ac">Search</button><datalist id="searchSuggestions"></datalist></form>
    </div>
  </header>
  <main class="wrap" id="app" tabindex="-1"></main>
  <nav class="bottom" id="nav" aria-label="Main"></nav>
  <div id="loader" popover="manual" role="status" aria-live="polite" aria-label="Loading" hidden>
    <div class="loader-card">
      <div class="loader-hindi" role="img" aria-label="थम जा!">
        <svg class="loader-heartbeat" viewBox="0 0 120 48" aria-hidden="true"><path d="M2 25h29l10-14 13 31 15-43 14 33 9-12h26"/></svg>
        <span class="loader-typing" aria-hidden="true"><span class="loader-word">थम</span><span class="loader-word loader-word-two">जा</span><span class="loader-exclamation">!</span></span>
      </div>
      <p class="loader-copy">ज़रा ठहरो, जींद खुल रहा है…</p>
    </div>
  </div>
  <div id="toast" popover="manual" role="status"></div>
  <script type="module" src="js/main.js"></script>
</body>

</html>
